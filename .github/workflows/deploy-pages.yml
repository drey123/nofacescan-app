name: Deploy to GitHub Pages

on:
  push:
    branches:
      - experiment/scanny-test-combined
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache FaceVerse upstream assets
        uses: actions/cache@v4
        with:
          path: .cache/faceverse
          key: faceverse-v4.1.0

      - name: Install FaceVerse build dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Build compact FaceVerse web assets
        run: python scripts/build-faceverse-lite.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
