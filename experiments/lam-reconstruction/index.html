<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanny Local Face Test</title><style>body{margin:0;background:#09090b;color:#fff;font-family:system-ui;text-align:center}main{max-width:760px;margin:auto;padding:18px}.stage{height:60vh;min-height:380px;border:1px solid #333;border-radius:18px;overflow:hidden;position:relative;background:#111}canvas{width:100%;height:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px}button,label{background:#eee;color:#111;border:0;border-radius:10px;padding:11px 14px;font-weight:700}input[type=file]{display:none}#status{padding:12px;min-height:24px;color:#a9b8ff}.ready{color:#8ee6a5!important}.err{color:#ff9b9b!important}.controls{display:none;grid-template-columns:repeat(3,1fr);gap:8px}.controls.show{display:grid}.controls div{background:#18181c;padding:8px;border-radius:10px}.controls span{font-size:12px;color:#aaa}input[type=range]{width:100%}</style></head><body><main><h2>Scanny Local Face Test</h2><p>Portrait → local face landmarks → curved personalized surface. No server reconstruction.</p><div class="stage"><canvas id="c"></canvas></div><div class="bar"><label>Upload portrait<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="live" disabled>Enable live tracking</button><button id="reset" disabled>Reset</button></div><div id="status">1. Upload a front-facing portrait.</div><div id="controls" class="controls"><div><span>Yaw</span><input id="yaw" type="range" min="-.55" max=".55" step=".01" value="0"></div><div><span>Pitch</span><input id="pitch" type="range" min="-.4" max=".4" step=".01" value="0"></div><div><span>Zoom</span><input id="zoom" type="range" min=".85" max="1.25" step=".01" value="1"></div><div><span>Left eye</span><input id="eyeL" type="range" min="0" max="1" step=".01"></div><div><span>Right eye</span><input id="eyeR" type="range" min="0" max="1" step=".01"></div><div><span>Mouth</span><input id="mouth" type="range" min="0" max="1" step=".01"></div></div><p id="help">Nothing changes until face detection succeeds. The status above will tell you exactly where it stops.</p></main><script type="module">
const S='https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js',M='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35',MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';const $=x=>document.getElementById(x),status=$('status');let THREE,scene,camera,renderer,mesh,tex,landmarker,stream=null,img,points,base;function msg(x,c=''){status.textContent=x;status.className=c}async function setup(){msg('2. Loading browser renderer…');THREE=await import(S);renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(28,1,.1,20);camera.position.z=5;scene.add(new THREE.HemisphereLight(0xffffff,0x222222,2));resize();addEventListener('resize',resize);msg('3. Ready. Upload a portrait.','ready');requestAnimationFrame(loop)}function resize(){if(!renderer)return;let r=$('c').parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}async function model(){if(landmarker)return;msg('3. Loading face model… (first load can take a while)');const v=await import(M);const fs=await v.FilesetResolver.forVisionTasks(M+'/wasm');landmarker=await v.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'IMAGE',numFaces:1,outputFaceBlendshapes:true});}function build(){msg('5. Building personalized face surface…');const xs=points.map(p=>p.x),ys=points.map(p=>p.y),minX=Math.max(0,Math.min(...xs)-.12),maxX=Math.min(1,Math.max(...xs)+.12),minY=Math.max(0,Math.min(...ys)-.15),maxY=Math.min(1,Math.max(...ys)+.15);const g=new THREE.PlaneGeometry(2,2,48,48),p=g.attributes.position,u=g.attributes.uv;const fp=points.filter(q=>q.x>=minX&&q.x<=maxX&&q.y>=minY&&q.y<=maxY);let lo=1,hi=-1;fp.forEach(q=>{lo=Math.min(lo,q.z);hi=Math.max(hi,q.z)});function z(x,y){let n=0,d=0;for(const q of fp){let dd=Math.hypot(x-q.x,y-q.y),w=1/Math.max(dd*dd,.0005);n+=w*q.z;d+=w}return d?n/d:0}for(let i=0;i<p.count;i++){let x=minX+(maxX-minX)*u.getX(i),y=maxY-(maxY-minY)*u.getY(i),zn=Math.max(0,Math.min(1,(z(x,y)-lo)/Math.max(hi-lo,.001)));p.setZ(i,(zn-.45)*.75)}const tc=document.createElement('canvas');tc.width=1024;tc.height=1024;tc.getContext('2d').drawImage(img,minX*img.naturalWidth,minY*img.naturalHeight,(maxX-minX)*img.naturalWidth,(maxY-minY)*img.naturalHeight,0,0,1024,1024);tex=new THREE.CanvasTexture(tc);const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.8});mesh=new THREE.Mesh(g,mat);scene.add(mesh);base=p.array.slice();$('controls').classList.add('show');$('live').disabled=false;$('reset').disabled=false;msg('6. DONE — local face created. Use the controllers below.','ready')}function apply(){if(!mesh)return;mesh.rotation.y=+$('yaw').value;mesh.rotation.x=+$('pitch').value;let z=+$('zoom').value;mesh.scale.set(z,z,z)}for(const id of ['yaw','pitch','zoom'])$(id).oninput=apply;$('reset').onclick=()=>{['yaw','pitch'].forEach(x=>$(x).value=0);$('zoom').value=1;apply()};$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;msg('1. Image received.');img=new Image();img.onload=async()=>{try{await setup();await model();msg('4. Detecting your face…');let r=landmarker.detect(img);if(!r.faceLandmarks?.length)throw Error('No clear face detected');points=r.faceLandmarks[0];build()}catch(err){console.error(err);msg('ERROR: '+(err.message||'Face model failed to load. Try another front-facing image or refresh.'),'err')}};img.src=URL.createObjectURL(f)};$('live').onclick=async()=>{try{if(!stream){const v=document.createElement('video');v.autoplay=true;v.playsInline=true;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});v.srcObject=stream;await v.play();$('live').textContent='Live tracking on';msg('LIVE — camera tracking is active.','ready')}}catch(e){msg('Camera could not start: '+e.message,'err')}};function loop(){requestAnimationFrame(loop);if(renderer)renderer.render(scene,camera)}setup().catch(e=>msg('STARTUP ERROR: '+e.message,'err'));</script></body></html>
