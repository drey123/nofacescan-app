<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoFaceScan</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/DirectionalPad.css">
    <link rel="stylesheet" href="src/InteractionMenu.css">
  </head>
  <body>
    <div id="app">
      <div id="navbar">
        <img src="/logo.png" alt="">
      </div>
      <div id="canvas-holder">
        <canvas id="canvas"></canvas>
      </div>
      <div id="interaction-menu">
        <div class="main-row">
          <div id="directional-pad" class="directional-pad">
            <div class="circle">
              <div class="horizontal-line"></div>
              <div class="vertical-line"></div>
            </div>
          </div>
          <div class="sliders" data-is-split="false">
            <div id="left-eye-slider" class="slider">
              <div class="track"></div>
              <div class="thumb">
                <img src="/icons/eye.svg" alt="" class="icon">
              </div>
              <div class="thumb-shadow"></div>
              <input type="range" name="" min="0" max="1" step="0.001">
            </div>
            <div id="right-eye-slider" class="slider">
              <div class="track"></div>
              <div class="thumb">
                <img src="/icons/eye.svg" alt="" class="icon">
              </div>
              <div class="thumb-shadow"></div>
              <input type="range" name="" min="0" max="1" step="0.001">
            </div>
            <!--
            <div id="grouped-eye-slider" class="slider grouped" style="--slider-index: 0; --slider-column-count: 2;">
              <div class="thumb"></div>
              <input type="range" name="" min="0" max="1" step="0.001">
            </div>
            -->
            <div id="mouth-slider" class="slider" style="--slider-index: 2;">
              <div class="track"></div>
              <div class="thumb">
                <img src="/icons/mouth.svg" alt="" class="icon">
              </div>
              <div class="thumb-shadow"></div>
              <input type="range" name="" min="0" max="1" step="0.001">
            </div>
            <div id="eye-slider-split-button" class="split-button">
              <div class="active-text">Join</div>
              <div class="inactive-text">Split</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
