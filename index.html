<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanny</title>
    <meta name="description" content="A simple face control interface">
  </head>
  <body>
    <div id="app">
      <div id="navbar" aria-label="Scanny navigation">
        <div id="brand">Scanny</div>
        <button id="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="app-menu">
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        </button>
        <div id="app-menu" hidden>
          <button id="image-upload-menu-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8.2" cy="9" r="1.4" fill="currentColor"/><path d="m6.5 17 4.1-4.3 2.8-2.7 1.9-2 2.2-2 1.9 3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Use an image</span>
          </button>
          <button id="three-model-menu-item" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m4.4 7.7 7.6 4.4 7.6-4.4M12 12.1V21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>Use 3D model</span>
          </button>
          <button id="adjust-image-menu-item" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>Adjust image</span>
          </button>
        </div>
        <input id="image-upload" type="file" accept="image/*" hidden>
      </div>
      <div id="canvas-holder">
        <canvas id="canvas"></canvas>
        <img id="image-background" alt="" aria-hidden="true" hidden>
        <img id="image-preview" alt="Uploaded face" hidden>
        <div id="reconstruction-status" hidden aria-live="polite">
          <div class="reconstruction-glimmer" aria-hidden="true"></div>
          <div class="reconstruction-card">
            <div id="reconstruction-stage">Preparing 3D face</div>
            <div id="reconstruction-detail">Starting…</div>
            <div class="reconstruction-progress"><div id="reconstruction-progress-bar"></div></div>
            <div id="reconstruction-metric">Waiting</div>
            <div id="reconstruction-error-actions" hidden>
              <button id="reconstruction-retry" type="button">Try again</button>
              <button id="reconstruction-copy" type="button">Copy error</button>
            </div>
          </div>
        </div>
      </div>
      <div id="image-editor" hidden aria-label="Adjust image">
        <div class="image-editor-scrim"></div>
        <div id="image-editor-frame">
          <div class="face-guide" aria-hidden="true"></div>
          <div id="image-editor-hint" class="image-editor-hint">Position the face inside the guide</div>
        </div>
        <div id="image-editor-controls">
          <label class="zoom-control" for="image-zoom"><span>Zoom</span><input id="image-zoom" type="range" min="0.65" max="2.5" step="0.01" value="1"></label>
          <button id="image-done-button" type="button">Done</button>
        </div>
      </div>
      <div id="interaction-menu">
        <div class="main-row">
          <div id="directional-pad" class="directional-pad"><div class="circle"><div class="horizontal-line"></div><div class="vertical-line"></div></div></div>
          <div class="sliders" data-is-split="false">
            <div id="left-eye-slider" class="slider"><div class="track"></div><div class="thumb"><img src="icons/eye.svg" alt="" class="icon"></div><div class="thumb-shadow"></div><input type="range" min="0" max="1" step="0.001"></div>
            <div id="right-eye-slider" class="slider"><div class="track"></div><div class="thumb"><img src="icons/eye.svg" alt="" class="icon"></div><div class="thumb-shadow"></div><input type="range" min="0" max="1" step="0.001"></div>
            <div id="mouth-slider" class="slider" style="--slider-index: 2;"><div class="track"></div><div class="thumb"><img src="icons/mouth.svg" alt="" class="icon"></div><div class="thumb-shadow"></div><input type="range" min="0" max="1" step="0.001"></div>
            <div id="eye-slider-split-button" class="split-button"><div class="active-text">Join</div><div class="inactive-text">Split</div></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.ts"></script>
    <script type="module" src="src/reconstructionErrorUX.ts"></script>
  </body>
</html>
